<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="theme-color" content="#0e1113" />
<title>动力电池 PACK 生产沙盘 · 双鱼座：cygzs16888</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='9' width='18' height='14' rx='2' fill='none' stroke='%23f2b134' stroke-width='1.6'/%3E%3Crect x='25' y='13' width='3' height='6' rx='1' fill='%23f2b134'/%3E%3Crect x='10' y='13' width='3' height='6' fill='%2337c978'/%3E%3Crect x='15' y='13' width='3' height='6' fill='%2337c978'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #e9eef2;
    --muted: #8da4b4;
    --line: rgba(178, 205, 222, 0.18);
    --amber: #f2b134;
    --green: #37c978;
    --red: #e0564b;
    --display: "DIN Alternate", "Avenir Next Condensed", "Helvetica Neue", "Segoe UI", sans-serif;
    --mono: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden; background: #0e1113; color: var(--ink);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; z-index: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  #label-layer { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 34%, rgba(0,0,0,0.08) 58%, rgba(0,0,0,0.46) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.22), transparent 18%, transparent 82%, rgba(0,0,0,0.26));
  }

  #brand {
    position: fixed; top: clamp(18px, 2.2vw, 30px); left: clamp(18px, 2.4vw, 34px);
    z-index: 5; pointer-events: none; user-select: none;
  }
  #brand .kicker {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em;
    color: rgba(157, 188, 207, 0.62); text-transform: uppercase; margin-bottom: 7px;
  }
  #brand h1 {
    margin: 0; font-weight: 600; font-size: clamp(16px, 1.5vw, 22px);
    letter-spacing: 0.08em; line-height: 1.12; color: #f0f3f4; text-transform: uppercase;
  }
  #brand h1 em { color: var(--amber); font-style: normal; }
  #brand .sub {
    margin-top: 6px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em;
    color: rgba(171, 195, 211, 0.55); text-transform: uppercase;
  }
  #brand .sign {
    margin-top: 5px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    color: rgba(242, 177, 52, 0.82);
  }
  #brand .cross-nav {
    display: inline-block; margin-top: 6px; pointer-events: auto;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    color: rgba(157, 188, 207, 0.82); text-decoration: none;
    border-bottom: 1px solid rgba(157, 188, 207, 0.3);
  }
  #brand .cross-nav:hover { color: #f0f3f4; border-color: rgba(242, 177, 52, 0.6); }

  #telemetry {
    position: fixed; top: clamp(18px, 2.1vw, 30px); right: clamp(18px, 2.4vw, 34px);
    z-index: 5; text-align: right; font-family: var(--mono); font-size: 9px;
    line-height: 1.9; letter-spacing: 0.14em; color: rgba(193, 217, 232, 0.5);
    pointer-events: none; text-transform: uppercase;
  }
  #telemetry .sig {
    display: inline-block; width: 5px; height: 5px; margin-right: 8px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 9px rgba(55, 201, 120, 0.9); vertical-align: 1px;
    animation: sigPulse 3.2s ease-in-out infinite;
  }

  #hud {
    position: fixed; left: clamp(16px, 2.4vw, 34px); bottom: clamp(16px, 2.4vw, 28px);
    z-index: 5; width: max-content; max-width: calc(100vw - 32px);
    padding: 13px 18px 12px 16px; border: 1px solid var(--line);
    border-left: 2px solid rgba(242, 177, 52, 0.86);
    background: linear-gradient(115deg, rgba(10,14,17,0.82), rgba(13,19,23,0.5));
    backdrop-filter: blur(13px) saturate(115%);
    -webkit-backdrop-filter: blur(13px) saturate(115%);
    box-shadow: 0 12px 34px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.035);
    pointer-events: none;
  }
  #hud .eyebrow {
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.24em;
    color: rgba(157, 188, 207, 0.62); text-transform: uppercase; margin-bottom: 6px;
  }
  #hud .hint {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    color: rgba(171, 195, 211, 0.72); white-space: nowrap; line-height: 1.7;
  }
  #hud .hint b { color: rgba(242, 177, 52, 0.9); font-weight: 600; }

  #toolbar {
    position: fixed; right: clamp(16px, 2.4vw, 34px); bottom: clamp(16px, 2.4vw, 28px);
    z-index: 6; display: flex; gap: 10px;
  }
  #toolbar button {
    width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; color: rgba(213, 229, 239, 0.82);
    background: rgba(12, 17, 21, 0.72); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); transition: background 150ms ease, border-color 150ms ease, transform 90ms ease;
  }
  #toolbar button:hover { background: rgba(24, 32, 38, 0.85); border-color: rgba(242,177,52,0.4); }
  #toolbar button:active { transform: scale(0.97); }
  #toolbar button svg { width: 18px; height: 18px; }

  .station-tag {
    font-family: var(--mono); pointer-events: none; user-select: none;
    padding: 5px 9px 6px; border: 1px solid var(--line); border-left: 2px solid var(--tc, var(--amber));
    background: linear-gradient(115deg, rgba(10,14,17,0.86), rgba(13,19,23,0.55));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 6px;
    white-space: nowrap; transform: translateY(-6px);
  }
  .station-tag.st1 { --tc: #5b7d94; }
  .station-tag.st2 { --tc: #f2b134; }
  .station-tag.st3 { --tc: #37c978; }
  .station-tag .num {
    font-size: 8px; letter-spacing: 0.2em; color: var(--tc, var(--amber)); text-transform: uppercase;
  }
  .station-tag .cn { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #f0f3f4; margin-top: 1px; }

  #loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #0e1113; transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }
  #loader .inner { width: min(320px, 70vw); text-align: center; }
  #loader .tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.36em;
    color: rgba(242,177,52,0.72); text-transform: uppercase; margin-bottom: 14px;
  }
  #loader .name {
    font-family: var(--display); font-size: clamp(18px, 2.3vw, 26px);
    letter-spacing: 0.16em; text-transform: uppercase; color: #eef2f4;
  }
  #loader .bar {
    position: relative; height: 1px; margin-top: 20px; overflow: hidden;
    background: rgba(158, 191, 214, 0.16);
  }
  #loader .bar::after {
    content: ""; position: absolute; top: 0; left: -35%; width: 35%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    animation: loadScan 1.5s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes loadScan { 0% { left: -35%; } 100% { left: 100%; } }
  @keyframes sigPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  @media (max-width: 720px) {
    #telemetry { display: none; }
    #hud { padding: 10px 13px 9px 12px; }
    #hud .hint { font-size: 9px; white-space: normal; }
    .station-tag { padding: 5px 8px 6px; }
    .station-tag .cn { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loader .bar::after, #telemetry .sig { animation: none; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://fastly.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================================
   0. Core state & helpers
   ========================================================================= */
const stage = document.getElementById('stage');
const labelLayer = document.getElementById('label-layer');
const clock = new THREE.Clock();
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const APP = {
  renderer: null, scene: null, camera: null, controls: null,
  composer: null, labelRenderer: null, bloomPass: null,
  envTexture: null, running: true, frameCount: 0, elapsed: 0
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 工位布局：沿 X 轴直线排布，间距 3.0，传送带居中 z=0
// stage 1 模组装配 / stage 2 系统集成 / stage 3 最终测试
const STATIONS = [
  { id: 'sort',  stage: 1, cn: '电芯分选配组', en: 'CELL SORTING',      x: -15 },
  { id: 'stack', stage: 1, cn: '堆叠加压固定', en: 'STACK / CLAMP',    x: -12 },
  { id: 'weld',  stage: 1, cn: '激光焊接连接', en: 'LASER WELDING',    x:  -9 },
  { id: 'into',  stage: 2, cn: '模组入箱',     en: 'MODULE INTO CASE', x:  -6 },
  { id: 'bms',   stage: 2, cn: 'BMS 安装采样', en: 'BMS & HARNESS',    x:  -3 },
  { id: 'hv',    stage: 2, cn: '高低压连接',   en: 'HV / LV BUSBAR',   x:   0 },
  { id: 'seal',  stage: 2, cn: '密封封装',     en: 'SEALING / CLOSING',x:   3 },
  { id: 'elec',  stage: 3, cn: '电气性能测试', en: 'ELEC. TEST',       x:   6 },
  { id: 'air',   stage: 3, cn: '气密性测试',   en: 'AIR-TIGHTNESS',    x:   9 },
  { id: 'aging', stage: 3, cn: '老化测试',     en: 'AGING CYCLING',    x:  12 },
  { id: 'pack',  stage: 3, cn: '包装下线',     en: 'PACKING / OFFLINE',x:  15 }
];

// 共享几何体（单位尺寸，用时缩放）
const GEO = {
  box:  new THREE.BoxGeometry(1, 1, 1),
  cyl:  new THREE.CylinderGeometry(1, 1, 1, 16, 1, false),
  cyl8: new THREE.CylinderGeometry(1, 1, 1, 8, 1, false),
  sph:  new THREE.SphereGeometry(1, 18, 12),
  cone: new THREE.ConeGeometry(1, 1, 16, 1, false),
  torus:new THREE.TorusGeometry(1, 0.08, 6, 24)
};

// 材质缓存：金属度二元，粗糙度按材料成因区分
const MAT = {};
function mat(key, opts) {
  if (!MAT[key]) MAT[key] = new THREE.MeshStandardMaterial(opts);
  return MAT[key];
}
function buildMaterials() {
  mat('floor',   { color: 0x181d20, roughness: 0.92, metalness: 0.0 });
  mat('plinth',  { color: 0x20262a, roughness: 0.85, metalness: 0.05 });
  mat('cabinet', { color: 0x2b3238, roughness: 0.6,  metalness: 0.3 });
  mat('frame',   { color: 0x6b767d, roughness: 0.38, metalness: 0.85 });
  mat('belt',    { color: 0x1c2124, roughness: 0.88, metalness: 0.0 });
  mat('cell',    { color: 0xc8cdd1, roughness: 0.34, metalness: 0.9 });
  mat('cellCap', { color: 0xd9534f, roughness: 0.45, metalness: 0.2 });
  mat('pack',    { color: 0x3a4248, roughness: 0.7,  metalness: 0.2 });
  mat('panel',   { color: 0x24302a, roughness: 0.55, metalness: 0.1 });
  mat('amber',   { color: 0xf2b134, roughness: 0.5,  metalness: 0.1 });
  mat('green',   { color: 0x37c978, roughness: 0.4,  metalness: 0.1, emissive: 0x1f9d58, emissiveIntensity: 0.9 });
  mat('red',     { color: 0xe0564b, roughness: 0.4,  metalness: 0.1, emissive: 0x9c2b23, emissiveIntensity: 0.7 });
  mat('wire',    { color: 0x22272a, roughness: 0.7,  metalness: 0.0 });
  mat('busbar',  { color: 0xc98a3a, roughness: 0.32, metalness: 0.9 });
  mat('carton',  { color: 0x8a7a5e, roughness: 0.85, metalness: 0.0 });
  mat('seal',    { color: 0x3c4a44, roughness: 0.6,  metalness: 0.1 });
  mat('stage1',  { color: 0x5b7d94, roughness: 0.7,  metalness: 0.0 });
  mat('stage2',  { color: 0xf2b134, roughness: 0.7,  metalness: 0.0 });
  mat('stage3',  { color: 0x37c978, roughness: 0.7,  metalness: 0.0 });
}

function mesh(geo, material, x, y, z, sx, sy, sz, parent) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || APP.scene).add(m);
  return m;
}

/* =========================================================================
   1. Renderer / Scene / Camera / Controls / Environment / Composer
   ========================================================================= */
function initialPixelRatio() {
  if (reducedMotion) return 1;
  const mobile = window.innerWidth < 720;
  return Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2);
}

function initRenderer() {
  const renderer = new THREE.WebGLRenderer({
    antialias: true, alpha: false, powerPreference: 'high-performance',
    stencil: false, depth: true
  });
  renderer.setPixelRatio(initialPixelRatio());
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = true;
  renderer.domElement.setAttribute('aria-label', '动力电池 PACK 生产沙盘 3D 视图');
  stage.appendChild(renderer.domElement);
  APP.renderer = renderer;
}

function initScene() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1113);
  scene.fog = new THREE.Fog(0x0e1113, 34, 78);

  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 200);
  camera.position.set(0, 13, 33);

  const controls = new OrbitControls(camera, APP.renderer.domElement);
  controls.target.set(0, 1.1, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.8;
  controls.panSpeed = 0.6;
  controls.touches.ONE = THREE.TOUCH.ROTATE;
  controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
  controls.screenSpacePanning = true;
  controls.minDistance = 6;
  controls.maxDistance = 50;
  controls.minPolarAngle = 0.32;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.autoRotate = !reducedMotion;
  controls.autoRotateSpeed = 0.3;
  controls.update();

  APP.scene = scene;
  APP.camera = camera;
  APP.controls = controls;
}

function initEnvironment() {
  const pmrem = new THREE.PMREMGenerator(APP.renderer);
  pmrem.compileEquirectangularShader();
  const room = new RoomEnvironment();
  const envRT = pmrem.fromScene(room, 0.04);
  APP.envTexture = envRT.texture;
  APP.scene.environment = envRT.texture;
  room.dispose();
  pmrem.dispose();
}

function initLights() {
  const scene = APP.scene;
  const ambient = new THREE.AmbientLight(0x2a343c, 0.5);
  scene.add(ambient);

  const hemi = new THREE.HemisphereLight(0x8fb4cf, 0x141719, 0.5);
  scene.add(hemi);

  // 主光：决定形体与投影方向（冷白）
  const key = new THREE.DirectionalLight(0xdfeef7, 2.1);
  key.position.set(12, 18, 10);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -22; key.shadow.camera.right = 22;
  key.shadow.camera.top = 14;   key.shadow.camera.bottom = -14;
  key.shadow.camera.near = 2;   key.shadow.camera.far = 50;
  key.shadow.bias = -0.0004;
  scene.add(key);

  // 补光：另一侧弱冷光，保暗部可读
  const fill = new THREE.DirectionalLight(0x9fc8ea, 0.55);
  fill.position.set(-14, 9, -10);
  scene.add(fill);

  // 轮廓光：从后方把主体从背景剥离
  const rim = new THREE.DirectionalLight(0xcfe6f2, 0.5);
  rim.position.set(-4, 12, -18);
  scene.add(rim);
}

function initComposer() {
  const w = window.innerWidth, h = window.innerHeight;
  const pr = APP.renderer.getPixelRatio();
  const caps = APP.renderer.capabilities;
  const supportsMSAA = !!caps.isWebGL2 &&
    (typeof caps.maxSamples !== 'number' || caps.maxSamples >= 4);
  const targetOptions = { type: THREE.HalfFloatType };
  if (supportsMSAA) targetOptions.samples = 4;
  const target = new THREE.WebGLRenderTarget(Math.round(w * pr), Math.round(h * pr), targetOptions);
  APP.postTarget = target;

  const composer = new EffectComposer(APP.renderer, target);
  composer.setSize(w, h);

  composer.addPass(new RenderPass(APP.scene, APP.camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.32, 0.5, 1.15);
  bloom.strength = 0.32; bloom.radius = 0.5; bloom.threshold = 1.15;
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  if (!supportsMSAA) composer.addPass(new SMAAPass(Math.round(w * pr), Math.round(h * pr)));

  APP.bloomPass = bloom;
  APP.composer = composer;

  APP.labelRenderer = new CSS2DRenderer();
  APP.labelRenderer.setSize(w, h);
  APP.labelRenderer.domElement.style.position = 'fixed';
  APP.labelRenderer.domElement.style.top = '0';
  APP.labelRenderer.domElement.style.left = '0';
  APP.labelRenderer.domElement.style.pointerEvents = 'none';
  labelLayer.appendChild(APP.labelRenderer.domElement);
}

/* =========================================================================
   2. Site base: plinth floor + main conveyor
   ========================================================================= */
function buildSite() {
  // 沙盘基座平台
  mesh(GEO.box, MAT.plinth, 0, -0.2, 0, 40, 0.4, 16, APP.scene);
  // 地坪面
  mesh(GEO.box, MAT.floor, 0, 0.005, 0, 39.6, 0.02, 15.6, APP.scene);

  // 传送带主线：皮带 + 两侧框架 + 支脚
  mesh(GEO.box, MAT.belt, 0, 0.55, 0, 36, 0.12, 2.2, APP.scene);
  mesh(GEO.box, MAT.frame, 0, 0.6,  1.2, 36, 0.18, 0.18, APP.scene);
  mesh(GEO.box, MAT.frame, 0, 0.6, -1.2, 36, 0.18, 0.18, APP.scene);
  for (let x = -17; x <= 17; x += 3.4) {
    mesh(GEO.box, MAT.frame, x, 0.28,  1.2, 0.16, 0.56, 0.16, APP.scene);
    mesh(GEO.box, MAT.frame, x, 0.28, -1.2, 0.16, 0.56, 0.16, APP.scene);
  }

  // 工位地面标线：按阶段着色（1 钢蓝 / 2 琥珀 / 3 绿）
  for (const s of STATIONS) {
    const sm = MAT['stage' + s.stage];
    mesh(GEO.box, sm, s.x, 0.02, 0, 2.8, 0.012, 2.6, APP.scene).receiveShadow = true;
  }

  // 阶段分区长条：沿地坪两侧标出三段归属
  const bands = [
    { mat: MAT.stage1, x: -12, w: 9 },
    { mat: MAT.stage2, x: -1.5, w: 12 },
    { mat: MAT.stage3, x:  10.5, w: 12 }
  ];
  for (const b of bands) {
    mesh(GEO.box, b.mat, b.x, 0.018, -7.2, b.w, 0.012, 0.3, APP.scene).receiveShadow = true;
    mesh(GEO.box, b.mat, b.x, 0.018,  7.2, b.w, 0.012, 0.3, APP.scene).receiveShadow = true;
  }
}

/* === STATIONS: station geometry builders === */
function cell(x, y, z, parent) {
  mesh(GEO.box, MAT.cell, x, y, z, 0.22, 0.5, 0.22, parent);
  mesh(GEO.box, MAT.cellCap, x, y + 0.26, z, 0.12, 0.03, 0.12, parent);
}

function cabinet(sx, z, parent) {
  mesh(GEO.box, MAT.cabinet, sx, 0.95, z, 1.5, 1.9, 1.1, parent);
  mesh(GEO.box, MAT.frame, sx, 1.92, z, 1.54, 0.06, 1.14, parent);
  // 柜面小屏
  mesh(GEO.box, MAT.panel, sx, 1.25, z + (z > 0 ? -0.56 : 0.56), 0.8, 0.46, 0.04, parent);
}

function workbench(sx, z, parent) {
  mesh(GEO.box, MAT.frame, sx, 0.82, z, 2.0, 0.1, 1.2, parent);
  mesh(GEO.box, MAT.frame, sx - 0.8, 0.4, z, 0.12, 0.8, 0.12, parent);
  mesh(GEO.box, MAT.frame, sx + 0.8, 0.4, z, 0.12, 0.8, 0.12, parent);
}

function beacon(sx, z, colorMat, parent) {
  const pole = mesh(GEO.cyl, MAT.frame, sx, 1.1, z, 0.05, 2.2, 0.05, parent);
  const lamp = mesh(GEO.sph, colorMat, sx, 2.32, z, 0.16, 0.16, 0.16, parent);
  ANIM.beacons.push({ mesh: lamp, base: 0.16, phase: Math.random() * Math.PI * 2 });
  return lamp;
}

function tag(def, idx) {
  const div = document.createElement('div');
  div.className = 'station-tag st' + def.stage;
  div.innerHTML =
    `<div class="num">${String(idx + 1).padStart(2, '0')} · ${def.en}</div>` +
    `<div class="cn">${def.cn}</div>`;
  const obj = new CSS2DObject(div);
  obj.position.set(def.x, idx % 2 === 0 ? 3.15 : 2.7, 0);
  APP.scene.add(obj);
  // 标签立柱
  mesh(GEO.cyl8, MAT.frame, def.x, 1.5, 1.7, 0.05, 3.0, 0.05, APP.scene);
}

function buildStations() {
  STATIONS.forEach((def, idx) => {
    const g = new THREE.Group();
    g.position.set(def.x, 0, 0);
    APP.scene.add(g);
    const sx = 0;

    switch (def.id) {
      case 'sort': {
        workbench(sx, -2.3, g);
        // 待配电芯 4×2
        for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++)
          cell(sx - 0.6 + i * 0.4, 1.12, -2.55 + j * 0.4, g);
        cabinet(sx, 2.5, g);
        // 分选探针
        mesh(GEO.cyl, MAT.frame, sx + 0.6, 1.4, -2.0, 0.04, 0.6, 0.04, g);
        beacon(sx + 1.1, 2.5, MAT.amber, g);
        break;
      }
      case 'stack': {
        // 工装托板 + 两排电芯 + 上下加压压板、立柱与钢带
        mesh(GEO.box, MAT.frame, sx, 0.72, 0, 1.9, 0.1, 1.1, g);
        for (let i = 0; i < 6; i++) {
          cell(sx - 0.65 + i * 0.26, 1.0, -0.26, g);
          cell(sx - 0.65 + i * 0.26, 1.0,  0.26, g);
        }
        mesh(GEO.box, MAT.frame, sx, 1.5, 0, 1.9, 0.1, 1.1, g);
        mesh(GEO.cyl, MAT.frame, sx - 0.85, 1.1, 0, 0.05, 0.8, 0.05, g);
        mesh(GEO.cyl, MAT.frame, sx + 0.85, 1.1, 0, 0.05, 0.8, 0.05, g);
        mesh(GEO.box, MAT.busbar, sx, 1.32, 0, 0.08, 0.06, 1.1, g);
        cabinet(sx, -2.5, g);
        beacon(sx - 1.1, -2.5, MAT.green, g);
        break;
      }
      case 'weld': {
        // 焊接罩框
        mesh(GEO.box, MAT.frame, sx, 2.5, -1.6, 2.2, 0.12, 0.12, g);
        mesh(GEO.box, MAT.frame, sx - 1.0, 1.25, -1.6, 0.12, 2.5, 0.12, g);
        mesh(GEO.box, MAT.frame, sx + 1.0, 1.25, -1.6, 0.12, 2.5, 0.12, g);
        // 待焊模组 + Busbar 汇流排
        mesh(GEO.box, MAT.frame, sx, 0.72, 0, 1.7, 0.1, 1.0, g);
        for (let i = 0; i < 5; i++) cell(sx - 0.52 + i * 0.26, 1.0, 0, g);
        mesh(GEO.box, MAT.busbar, sx, 1.28, 0, 1.5, 0.05, 0.3, g);

        const arm = new THREE.Group();
        arm.position.set(sx + 1.4, 0, -2.4);
        g.add(arm);
        mesh(GEO.cyl, MAT.cabinet, 0, 0.18, 0, 0.34, 0.36, 0.34, arm);
        const arm1 = mesh(GEO.box, MAT.frame, 0, 0.75, 0, 0.22, 1.1, 0.22, arm);
        arm1.position.y = 0.75;
        const arm2 = mesh(GEO.box, MAT.frame, 0.35, 1.35, 0, 0.18, 0.9, 0.18, arm);
        const nozzle = mesh(GEO.cone, MAT.frame, 0.7, 0.95, 0, 0.1, 0.22, 0.1, arm);
        const tip = mesh(GEO.sph, MAT.red, 0.7, 0.8, 0, 0.08, 0.08, 0.08, arm);
        ANIM.arms.push({ arm1, arm2, nozzle, tip, base1: -0.35, base2: 0.5 });
        beacon(sx - 1.1, -1.6, MAT.red, g);
        break;
      }
      case 'into': {
        // 下箱体：底 + 四壁，内置两模组
        mesh(GEO.box, MAT.pack, sx, 0.6, 0, 2.2, 0.14, 1.5, g);
        mesh(GEO.box, MAT.pack, sx, 0.95, -0.7, 2.2, 0.6, 0.12, g);
        mesh(GEO.box, MAT.pack, sx, 0.95,  0.7, 2.2, 0.6, 0.12, g);
        mesh(GEO.box, MAT.pack, sx - 1.04, 0.95, 0, 0.12, 0.6, 1.5, g);
        mesh(GEO.box, MAT.pack, sx + 1.04, 0.95, 0, 0.12, 0.6, 1.5, g);
        mesh(GEO.box, MAT.pack, sx - 0.45, 0.9, 0, 0.7, 0.35, 1.1, g);
        mesh(GEO.box, MAT.pack, sx + 0.45, 0.9, 0, 0.7, 0.35, 1.1, g);
        // 吊具横梁 + 吊钩
        mesh(GEO.box, MAT.frame, sx, 2.3, 0, 2.0, 0.1, 0.1, g);
        mesh(GEO.cyl, MAT.frame, sx, 1.8, 0, 0.04, 0.9, 0.04, g);
        cabinet(sx, 2.5, g);
        beacon(sx - 1.1, 2.5, MAT.amber, g);
        break;
      }
      case 'bms': {
        workbench(sx, -2.3, g);
        // BMS 控制板 + 元件 + 采样线束
        mesh(GEO.box, MAT.panel, sx, 0.92, -2.3, 1.4, 0.06, 0.9, g);
        for (let i = 0; i < 4; i++)
          mesh(GEO.box, MAT.cabinet, sx - 0.45 + i * 0.3, 1.0, -2.45, 0.15, 0.1, 0.15, g);
        for (let i = 0; i < 3; i++) {
          const w = mesh(GEO.cyl, MAT.wire, sx - 0.3 + i * 0.3, 0.96, -1.95, 0.025, 0.6, 0.025, g);
          w.rotation.z = Math.PI / 2;
        }
        cabinet(sx, 2.5, g);
        beacon(sx + 1.1, 2.5, MAT.green, g);
        break;
      }
      case 'hv': {
        // 两模组 + 高压铜排串联 + 继电器盒 + 低压线束
        mesh(GEO.box, MAT.pack, sx - 0.5, 0.8, 0, 0.8, 0.4, 1.0, g);
        mesh(GEO.box, MAT.pack, sx + 0.5, 0.8, 0, 0.8, 0.4, 1.0, g);
        mesh(GEO.box, MAT.busbar, sx, 1.05, 0, 1.6, 0.06, 0.22, g);
        mesh(GEO.box, MAT.cabinet, sx + 1.1, 0.5, 0.6, 0.4, 0.5, 0.4, g);
        const w = mesh(GEO.cyl, MAT.wire, sx - 0.2, 0.7, 0.7, 0.03, 0.9, 0.03, g);
        w.rotation.z = Math.PI / 2;
        cabinet(sx, -2.5, g);
        beacon(sx - 1.1, -2.5, MAT.amber, g);
        break;
      }
      case 'seal': {
        // 闭合 PACK：箱体 + 顶盖 + 密封胶条 + 螺栓
        mesh(GEO.box, MAT.pack, sx, 0.8, 0, 2.2, 0.8, 1.5, g);
        mesh(GEO.box, MAT.frame, sx, 1.25, 0, 2.24, 0.08, 1.54, g);
        mesh(GEO.box, MAT.seal, sx, 1.18, 0.78, 2.2, 0.05, 0.06, g);
        mesh(GEO.box, MAT.seal, sx, 1.18, -0.78, 2.2, 0.05, 0.06, g);
        for (let i = 0; i < 5; i++)
          mesh(GEO.cyl8, MAT.frame, sx - 0.9 + i * 0.45, 1.32, 0.7, 0.05, 0.05, 0.05, g);
        cabinet(sx, 2.5, g);
        beacon(sx - 1.1, 2.5, MAT.green, g);
        break;
      }
      case 'elec': {
        workbench(sx, -2.3, g);
        // 测试仪表屏 + 探针 + 三色灯柱
        mesh(GEO.box, MAT.cabinet, sx, 1.35, -2.6, 1.2, 0.9, 0.12, g);
        mesh(GEO.box, MAT.green, sx, 1.35, -2.52, 0.9, 0.55, 0.04, g);
        mesh(GEO.cyl, MAT.frame, sx + 0.6, 1.0, -1.9, 0.04, 0.5, 0.04, g);
        const r1 = mesh(GEO.sph, MAT.red,   sx + 1.1, 2.15, -1.6, 0.13, 0.13, 0.13, g);
        const r2 = mesh(GEO.sph, MAT.amber, sx + 1.1, 1.88, -1.6, 0.13, 0.13, 0.13, g);
        const r3 = mesh(GEO.sph, MAT.green, sx + 1.1, 1.61, -1.6, 0.13, 0.13, 0.13, g);
        ANIM.beacons.push({ mesh: r1, base: 0.13, phase: 0 });
        ANIM.beacons.push({ mesh: r2, base: 0.13, phase: 1.2 });
        ANIM.beacons.push({ mesh: r3, base: 0.13, phase: 2.4 });
        cabinet(sx, 2.5, g);
        break;
      }
      case 'air': {
        // 气密测试箱 + 气压表 + 气管
        mesh(GEO.box, MAT.pack, sx, 0.8, 0, 1.8, 0.9, 1.3, g);
        const gauge = mesh(GEO.cyl, MAT.frame, sx + 0.9, 1.4, -1.6, 0.3, 0.08, 0.3, g);
        gauge.rotation.x = Math.PI / 2;
        mesh(GEO.box, MAT.red, sx + 0.9, 1.4, -1.53, 0.04, 0.2, 0.02, g);
        const tube = mesh(GEO.cyl, MAT.wire, sx + 0.4, 1.0, -0.9, 0.03, 0.8, 0.03, g);
        tube.rotation.x = Math.PI / 2;
        cabinet(sx, 2.5, g);
        beacon(sx - 1.1, 2.5, MAT.amber, g);
        break;
      }
      case 'aging': {
        // 老化架两层，每层三只 PACK
        mesh(GEO.box, MAT.frame, sx, 0.7, 0, 1.9, 0.08, 1.1, g);
        mesh(GEO.box, MAT.frame, sx, 1.5, 0, 1.9, 0.08, 1.1, g);
        mesh(GEO.box, MAT.frame, sx - 0.85, 1.1, 0, 0.1, 0.9, 0.1, g);
        mesh(GEO.box, MAT.frame, sx + 0.85, 1.1, 0, 0.1, 0.9, 0.1, g);
        for (let lvl = 0; lvl < 2; lvl++) for (let i = 0; i < 3; i++)
          mesh(GEO.box, MAT.pack, sx - 0.6 + i * 0.6, 1.05 + lvl * 0.8, 0, 0.45, 0.3, 0.8, g);
        cabinet(sx, -2.5, g);
        beacon(sx - 1.1, -2.5, MAT.green, g);
        break;
      }
      case 'pack': {
        // 成品 PACK + 外包装箱 + 车辆轮廓
        mesh(GEO.box, MAT.carton, sx - 0.7, 0.35, 0, 1.9, 0.7, 1.4, g);
        mesh(GEO.box, MAT.pack, sx - 0.7, 0.85, 0, 1.8, 0.7, 1.3, g);
        mesh(GEO.box, MAT.frame, sx - 0.7, 1.23, 0, 1.84, 0.07, 1.34, g);
        mesh(GEO.box, MAT.amber, sx - 0.7, 0.9, 0.67, 0.45, 0.18, 0.04, g);
        const tri = new THREE.Group();
        tri.position.set(sx + 1.5, 0, 0);
        g.add(tri);
        mesh(GEO.box, MAT.frame, 0, 0.7, 0, 1.4, 0.12, 0.12, tri);
        const wf = mesh(GEO.torus, MAT.wire, -0.6, 0.45, 0, 0.4, 0.4, 0.4, tri);
        wf.rotation.y = Math.PI / 2;
        const wr = mesh(GEO.torus, MAT.wire, 0.6, 0.45, -0.3, 0.36, 0.36, 0.36, tri);
        wr.rotation.y = Math.PI / 2;
        const wr2 = mesh(GEO.torus, MAT.wire, 0.6, 0.45, 0.3, 0.36, 0.36, 0.36, tri);
        wr2.rotation.y = Math.PI / 2;
        beacon(sx - 1.5, 2.5, MAT.green, g);
        break;
      }
    }
    tag(def, idx);
  });

  // 传送带流动物料：托盘沿主线循环
  for (let i = 0; i < 6; i++) {
    const tray = new THREE.Group();
    const kind = i % 3;
    if (kind === 0) {
      mesh(GEO.box, MAT.frame, 0, 0.66, 0, 0.7, 0.06, 0.7, tray);
      for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++)
        cell(-0.18 + a * 0.36, 0.95, -0.18 + b * 0.36, tray);
    } else if (kind === 1) {
      mesh(GEO.box, MAT.pack, 0, 0.72, 0, 0.9, 0.3, 0.7, tray);
    } else {
      mesh(GEO.box, MAT.pack, 0, 0.78, 0, 1.1, 0.42, 0.8, tray);
      mesh(GEO.box, MAT.frame, 0, 1.02, 0, 1.14, 0.06, 0.84, tray);
    }
    tray.position.set(-18 + i * 6, 0, 0);
    APP.scene.add(tray);
    ANIM.conveyors.push({ obj: tray, speed: 0.9, offset: i * 6 });
  }
}

/* === ANIMATION: per-frame updates === */
const ANIM = { conveyors: [], arms: [], beacons: [] };
function updateScene(t, dt) {
  if (reducedMotion) return;

  // 传送带物料沿主线循环，到末端回绕
  for (const c of ANIM.conveyors) {
    const v = ((t * c.speed + c.offset) % 36 + 36) % 36;
    c.obj.position.x = -18 + v;
  }

  // 焊接机械臂：大臂 / 小臂受控往复，焊点头微光随焊接节拍闪动
  for (const a of ANIM.arms) {
    const s = Math.sin(t * 1.1);
    a.arm1.rotation.z = a.base1 + s * 0.18;
    a.arm2.rotation.z = a.base2 - s * 0.22;
    const f = 0.7 + 0.3 * Math.abs(Math.sin(t * 6));
    a.tip.scale.set(f, f, f);
  }

  // 状态灯呼吸（受控振幅，非随机闪烁）
  for (const b of ANIM.beacons) {
    const k = 0.78 + 0.22 * Math.sin(t * 2.2 + b.phase);
    b.mesh.scale.setScalar(b.base * k);
  }
}

/* =========================================================================
   3. Resize / visibility / controls wiring
   ========================================================================= */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  const pr = APP.renderer.getPixelRatio();
  APP.camera.aspect = w / h;
  APP.camera.updateProjectionMatrix();
  APP.renderer.setSize(w, h);
  APP.composer.setSize(w, h);
  APP.labelRenderer.setSize(w, h);
}

function initControlsUI() {
  const btnPause = document.getElementById('btn-pause');
  const btnReset = document.getElementById('btn-reset');

  function setPauseIcon(paused) {
    btnPause.innerHTML = paused
      ? '<svg viewBox="0 0 16 16" fill="none"><path d="M4.5 3.2l8 4.8-8 4.8z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 16 16" fill="none"><rect x="4" y="3" width="2.4" height="10" rx="0.5" fill="currentColor"/><rect x="9.6" y="3" width="2.4" height="10" rx="0.5" fill="currentColor"/></svg>';
  }

  btnPause.addEventListener('click', () => {
    APP.controls.autoRotate = !APP.controls.autoRotate;
    setPauseIcon(!APP.controls.autoRotate);
  });

  btnReset.addEventListener('click', () => {
    APP.camera.position.set(0, 13, 33);
    APP.controls.target.set(0, 1.1, 0);
    APP.controls.update();
  });

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 140));

  document.addEventListener('visibilitychange', () => {
    APP.running = !document.hidden;
    if (APP.running) clock.getDelta();
  });
}

/* =========================================================================
   4. Main loop
   ========================================================================= */
function animate() {
  requestAnimationFrame(animate);
  if (!APP.running) return;
  const dt = Math.min(clock.getDelta(), 0.055);
  const t = clock.elapsedTime;
  APP.elapsed = t;
  APP.frameCount++;

  updateScene(t, dt);
  APP.controls.update();

  APP.composer.render();
  APP.labelRenderer.render(APP.scene, APP.camera);
}

function init() {
  buildMaterials();
  initRenderer();
  initScene();
  initEnvironment();
  initLights();
  initComposer();
  buildSite();
  buildStations();
  initControlsUI();
  animate();
  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 420);
}

init();
</script>
